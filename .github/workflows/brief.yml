name: Dobowy brief OSINT

# Codziennie buduje nowe wydanie briefu z kanałów RSS i zapisuje je w repozytorium.
# Uruchamianie ręczne: zakładka Actions → Dobowy brief OSINT → Run workflow.
on:
  schedule:
    - cron: "40 5 * * *" # 06:40 czasu polskiego zimą, 07:40 latem
  workflow_dispatch:
    inputs:
      godziny:
        description: "Ile godzin wstecz zbierać"
        required: false
        default: "24"

permissions:
  contents: write

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  wydanie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Zbierz kanały RSS
        shell: bash
        run: |
          set -euo pipefail
          node tools/agreguj.mjs --godziny "${{ inputs.godziny || '24' }}" --out "$RUNNER_TEMP/wydanie.json" | tee "$RUNNER_TEMP/log.txt"

      - name: Sprawdź dane i dodaj wydanie
        shell: bash
        run: |
          set -euo pipefail
          node tools/brief.mjs add "$RUNNER_TEMP/wydanie.json" | tee -a "$RUNNER_TEMP/log.txt"

      - name: Opublikuj zmiany
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- dobowy-brief-data.js; then
            echo "Dane bez zmian, nic nie publikuję." | tee -a "$RUNNER_TEMP/log.txt"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dobowy-brief-data.js
          git commit -m "Brief dobowy $(TZ=Europe/Warsaw date +%F) (agregacja RSS)"
          git push

      - name: Podsumowanie przebiegu
        if: always()
        shell: bash
        run: |
          {
            echo '## Dobowy brief OSINT'
            echo '```'
            cat "$RUNNER_TEMP/log.txt" 2>/dev/null || echo "Brak logu: przebieg przerwany wcześnie."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
