name: Sprawdź kanały RSS

# Narzędzie utrzymaniowe: uruchom ręcznie, żeby zobaczyć, które kanały
# odpowiadają z serwerów GitHuba. Niczego nie publikuje.
on:
  workflow_dispatch:
    inputs:
      plik:
        description: "Plik z adresami do sprawdzenia"
        required: false
        default: "tools/kandydaci.txt"

jobs:
  sprawdz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - shell: bash
        run: |
          set -euo pipefail
          node tools/sprawdz.mjs "${{ inputs.plik || 'tools/kandydaci.txt' }}" | tee "$RUNNER_TEMP/wynik.txt"
          { echo '## Kanały'; echo '```'; cat "$RUNNER_TEMP/wynik.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
