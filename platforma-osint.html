<title>Biały Wywiad — Platforma OSINT — dostęp chroniony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#0f1210;--panel:#171b18;--ink:#e3e8e0;--muted:#8d978b;--line:#2a312b;--accent:#8fb573;--accent-ink:#0f1210;--bad:#d06c5c}
@media (prefers-color-scheme: light){:root{--bg:#eef0ec;--panel:#f8f9f6;--ink:#1d221d;--muted:#5d665c;--line:#cfd5cb;--accent:#3d5a3a;--accent-ink:#ffffff;--bad:#a33a2a}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font:16px/1.6 'IBM Plex Sans',system-ui,sans-serif;padding:20px}
.box{width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:3px;padding:28px}
.brand{font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font:700 clamp(24px,5vw,32px)/1.1 'Barlow Condensed',sans-serif;text-transform:uppercase;letter-spacing:.01em;margin:12px 0 6px}
p.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
label{display:block;font:500 12px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px 12px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:3px}
input[type=password]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.rem{display:flex;gap:8px;align-items:center;margin:14px 0 18px;font-size:13.5px;color:var(--muted)}
.rem input{accent-color:var(--accent)}
button{width:100%;font:600 14px/1 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:13px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:3px;cursor:pointer}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-top:14px;color:var(--bad);font-size:13.5px;border-left:2px solid var(--bad);padding-left:10px}
.foot{margin-top:22px;font:400 11px/1.6 'IBM Plex Mono',monospace;color:var(--muted)}
.foot a{color:inherit}
</style>
</head>
<body>
<main class="box">
  <div class="brand">Biały Wywiad // Akademia OSINT</div>
  <h1>Biały Wywiad — Platforma OSINT</h1>
  <p class="sub">Materiał chroniony. Treść jest zaszyfrowana (AES-256) i zostanie odszyfrowana w Twojej przeglądarce po podaniu hasła.</p>
  <form id="f">
    <label for="pw">Hasło dostępu</label>
    <input type="password" id="pw" autocomplete="current-password" autofocus required>
    <div class="rem"><input type="checkbox" id="rem"><label for="rem" style="all:unset;cursor:pointer">Zapamiętaj na tym urządzeniu</label></div>
    <button id="go" type="submit">Odblokuj</button>
    <p class="err" id="err">Nieprawidłowe hasło. Spróbuj ponownie.</p>
  </form>
  <p class="foot">Dostęp tylko dla osób z wykupionym materiałem · <a href="index.html">← wróć do strony głównej</a></p>
</main>

const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function keyFromPassword(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
  const bits=await crypto.subtle.deriveBits({name:"PBKDF2",salt:b2a(SALT),iterations:ITER,hash:"SHA-256"},base,256);
  return new Uint8Array(bits);
}
async function tryDecrypt(rawKey){
  const key=await crypto.subtle.importKey("raw",rawKey,"AES-GCM",false,["decrypt"]);
  const data=b2a(PAYLOAD), iv=data.slice(0,12), ct=data.slice(12);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,ct);
  return new TextDecoder().decode(pt);
}
function show(html){ document.open(); document.write(html); document.close(); }
(async()=>{ // auto-unlock if key remembered
  try{ const s=localStorage.getItem(KS); if(s){ show(await tryDecrypt(b2a(s))); } }catch(e){ try{localStorage.removeItem(KS);}catch(_){}}
})();
document.getElementById("f").addEventListener("submit",async ev=>{
  ev.preventDefault();
  const btn=document.getElementById("go"), err=document.getElementById("err");
  btn.disabled=true; btn.textContent="Odszyfrowywanie…"; err.style.display="none";
  try{
    const raw=await keyFromPassword(document.getElementById("pw").value);
    const html=await tryDecrypt(raw);
    if(document.getElementById("rem").checked){ try{ localStorage.setItem(KS,btoa(String.fromCharCode(...raw))); }catch(e){} }
    show(html);
  }catch(e){
    err.style.display="block"; btn.disabled=false; btn.textContent="Odblokuj";
    const pw=document.getElementById("pw"); pw.select(); pw.focus();
  }
});
</script>
